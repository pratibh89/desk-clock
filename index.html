<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Desk Clock">
<meta name="theme-color" content="#000000">
<title>Desk Clock</title>
<style>
/* ============================================================
   EASY CHANGES: colours live here.
   ============================================================ */
:root{
  --bg:#000000;          /* page background */
  --card:#141414;        /* flip card colour */
  --card-edge:#1c1c1c;   /* card highlight */
  --digit:#d9d9d9;       /* clock digits */
  --muted:#7a7a7a;       /* small text */
  --accent:#ffb347;      /* joke punchline colour */
}
/* Written for iOS 12 Safari (iPhone 6): no flex gap, no optional chaining. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--digit);font-family:-apple-system,"Helvetica Neue",Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

/* Always landscape: in portrait the whole stage is turned sideways */
#stage{position:fixed;top:0;left:0;width:100vw;height:100vh;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;padding:5vh 4vw 4vh}
@media (orientation:portrait){
  #stage{width:100vh;height:100vw;-webkit-transform:translateX(100vw) rotate(90deg);transform:translateX(100vw) rotate(90deg);-webkit-transform-origin:0 0;transform-origin:0 0}
}

/* ---------- flip clock ---------- */
.clock{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;min-height:0}
.group{display:-webkit-flex;display:flex;position:relative}
.colon{width:4vmax;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.colon i{display:block;width:1.3vmax;height:1.3vmax;border-radius:50%;background:#2a2a2a;margin:2.2vmax 0}
.flip{position:relative;width:19vmax;height:27vmax;margin:0 .6vmax;-webkit-perspective:60vmax;perspective:60vmax;font-size:24vmax;font-weight:700;line-height:27vmax;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.half{position:absolute;left:0;width:100%;height:50%;overflow:hidden;background:var(--card);color:var(--digit);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.half span{display:block;height:27vmax}
.top{top:0;border-radius:1.6vmax 1.6vmax 0 0;background:linear-gradient(180deg,var(--card-edge),var(--card))}
.bottom{bottom:0;border-radius:0 0 1.6vmax 1.6vmax}
.bottom span{margin-top:-13.5vmax}
.flip:after{content:"";position:absolute;left:0;right:0;top:50%;height:.35vmax;margin-top:-.175vmax;background:var(--bg);z-index:5}
.top.anim{-webkit-transform-origin:50% 100%;transform-origin:50% 100%;z-index:3;-webkit-animation:fold .3s ease-in forwards;animation:fold .3s ease-in forwards}
.bottom.anim{-webkit-transform-origin:50% 0;transform-origin:50% 0;z-index:3;-webkit-transform:rotateX(90deg);transform:rotateX(90deg);-webkit-animation:unfold .3s .3s ease-out forwards;animation:unfold .3s .3s ease-out forwards}
@-webkit-keyframes fold{to{-webkit-transform:rotateX(-90deg)}}
@keyframes fold{to{transform:rotateX(-90deg)}}
@-webkit-keyframes unfold{to{-webkit-transform:rotateX(0)}}
@keyframes unfold{to{transform:rotateX(0)}}
.ampm{position:absolute;left:1.6vmax;bottom:1.2vmax;font-size:2.2vmax;font-weight:600;color:var(--muted);z-index:6;letter-spacing:.05em}

/* ---------- info strip ---------- */
.strip{display:-webkit-flex;display:flex;-webkit-align-items:stretch;align-items:stretch;margin-top:3vh;font-size:2.4vmax;color:var(--muted);border-top:1px solid #1a1a1a;padding-top:3vh}
.wx{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding-right:3vmax;border-right:1px solid #1a1a1a;white-space:nowrap}
.wx .ico{font-size:5vmax;line-height:1;margin-right:1.4vmax}
.wx .t{font-size:5vmax;font-weight:300;color:var(--digit);line-height:1;margin-right:1.6vmax}
.wx .meta{line-height:1.35}
.wx .meta b{color:var(--digit);font-weight:500}
.joke{-webkit-flex:1;flex:1;padding-left:3vmax;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;line-height:1.3;min-width:0}
.joke .q{color:var(--digit)}
.joke .a{color:var(--accent);margin-top:.4vmax}
.date{position:absolute;top:2.2vh;left:0;right:0;text-align:center;font-size:2vmax;color:var(--muted);letter-spacing:.18em;text-transform:uppercase}
#dim{position:fixed;top:0;left:0;right:0;bottom:0;background:#000;opacity:0;pointer-events:none;-webkit-transition:opacity 3s;transition:opacity 3s;z-index:20}
</style>
</head>
<body>
<div id="stage">
  <div class="date" id="date"></div>
  <div class="clock">
    <div class="group">
      <div class="flip" id="d0"></div><div class="flip" id="d1"></div>
      <div class="ampm" id="ampm"></div>
    </div>
    <div class="colon"><i></i><i></i></div>
    <div class="group">
      <div class="flip" id="d2"></div><div class="flip" id="d3"></div>
    </div>
  </div>
  <div class="strip">
    <div class="wx">
      <span class="ico" id="ico">·</span>
      <span class="t" id="temp">--°</span>
      <span class="meta"><span id="desc">Mississauga</span><br>H <b id="hi">--</b> L <b id="lo">--</b> · Feels <b id="feels">--</b></span>
    </div>
    <div class="joke"><div class="q" id="jq"></div><div class="a" id="ja"></div></div>
  </div>
</div>
<div id="dim"></div>

<script>
(function(){
  /* ============================================================
     EASY CHANGES: settings live here.
     ============================================================ */
  var CONFIG = {
    city: 'Mississauga',
    lat: 43.589, lon: -79.6441,        // change for another city
    timeZone: 'America/Toronto',
    use24h: false,                       // true = 14:05, false = 2:05 PM
    jokeEveryHours: 4,
    dimFrom: 23, dimUntil: 6,            // night dimming hours (set dimFrom = dimUntil to turn off)
    dimAmount: 0.6                       // 0 = none, 1 = black
  };

  // One joke per block of hours, cycling. Add or remove lines freely: ["setup","punchline"],
  var JOKES = [
    ["Why don't skeletons fight each other?","They don't have the guts."],
    ["I told my wife she was drawing her eyebrows too high.","She looked surprised."],
    ["Why did the scarecrow win an award?","He was outstanding in his field."],
    ["What do you call a fake noodle?","An impasta."],
    ["Why can't a bicycle stand up by itself?","It's two tired."],
    ["I'm reading a book about anti-gravity.","It's impossible to put down."],
    ["What do you call a bear with no teeth?","A gummy bear."],
    ["Why did the math book look sad?","It had too many problems."],
    ["How does a penguin build its house?","Igloos it together."],
    ["Why don't eggs tell jokes?","They'd crack each other up."],
    ["What did the ocean say to the beach?","Nothing, it just waved."],
    ["Why did the coffee file a police report?","It got mugged."],
    ["What do you call cheese that isn't yours?","Nacho cheese."],
    ["Why are elevator jokes so good?","They work on many levels."],
    ["I used to hate facial hair...","but then it grew on me."],
    ["What do you call a sleeping bull?","A bulldozer."],
    ["Why did the golfer bring two pairs of pants?","In case he got a hole in one."],
    ["How do you organize a space party?","You planet."],
    ["Why don't scientists trust atoms?","Because they make up everything."],
    ["What's orange and sounds like a parrot?","A carrot."],
    ["Why did the tomato blush?","It saw the salad dressing."],
    ["What do you call a dinosaur with an extensive vocabulary?","A thesaurus."],
    ["Why did the cookie go to the doctor?","It was feeling crummy."],
    ["What did one wall say to the other?","I'll meet you at the corner."],
    ["Why was the computer cold?","It left its Windows open."],
    ["What do you call a lazy kangaroo?","A pouch potato."],
    ["Why do cows wear bells?","Because their horns don't work."],
    ["What did the janitor say when he jumped out of the closet?","Supplies!"],
    ["Why can't you give Elsa a balloon?","She'll let it go."],
    ["What do you call a pile of cats?","A meowntain."],
    ["What did the grape do when it got stepped on?","It let out a little wine."],
    ["How do you make a tissue dance?","Put a little boogie in it."],
    ["Why are ghosts bad liars?","You can see right through them."],
    ["Why did the stadium get hot after the game?","All the fans left."],
    ["What kind of shoes do ninjas wear?","Sneakers."],
    ["Why don't oysters share their pearls?","Because they're shellfish."],
    ["What do you call a fish wearing a bowtie?","Sofishticated."],
    ["How do trees get online?","They just log in."],
    ["Why did the picture go to jail?","It was framed."],
    ["What did the zero say to the eight?","Nice belt."],
    ["Why do seagulls fly over the sea?","If they flew over the bay, they'd be bagels."],
    ["What do you call a snowman with a six-pack?","An abdominal snowman."],
    ["Why did the Canadian cross the road?","To say sorry to the person on the other side."],
    ["What's a Canadian's favourite kind of math?","Moose-tiplication."],
    ["Why did the hockey player bring string to the game?","So he could tie the score."],
    ["Why are Toronto drivers so calm in traffic?","Years of practice on the 401."],
    ["What's a snowman's favourite breakfast?","Frosted Flakes."],
    ["Why did the maple tree go to therapy?","Too many sappy feelings."],
    ["What do you call a deer with no eyes?","No idea."],
    ["Why did the phone wear glasses?","It lost its contacts."],
    ["What did the router say to the doctor?","It hurts when IP."],
    ["Why did the developer go broke?","He used up all his cache."],
    ["How many programmers does it take to change a light bulb?","None, that's a hardware problem."],
    ["Why do Java developers wear glasses?","Because they don't C#."],
    ["What's an astronaut's favourite key on a keyboard?","The space bar."],
    ["Why was the clock kicked out of the library?","It tocked too much."],
    ["What do you call a belt made of watches?","A waist of time."],
    ["Why did the banana go to the doctor?","It wasn't peeling well."],
    ["What do you call a boomerang that won't come back?","A stick."],
    ["Why did the gym close down?","It just didn't work out."],
    ["What does a cloud wear under its raincoat?","Thunderwear."],
    ["Why did the snowflake break up with the raindrop?","It needed space to chill."],
    ["What did one snowman say to the other?","Do you smell carrots?"],
    ["Why don't mountains get cold?","They wear snow caps."]
  ];

  function $(id){ return document.getElementById(id); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }

  function wmo(code, isDay){
    var map = {0:[isDay?'☀️':'🌙','Clear'],1:[isDay?'🌤️':'🌙','Mostly clear'],2:[isDay?'⛅':'☁️','Partly cloudy'],3:['☁️','Overcast'],
      45:['🌫️','Fog'],48:['🌫️','Freezing fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌧️','Heavy drizzle'],
      56:['🌧️','Freezing drizzle'],57:['🌧️','Freezing drizzle'],61:['🌦️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],
      66:['🌧️','Freezing rain'],67:['🌧️','Freezing rain'],71:['🌨️','Light snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],77:['🌨️','Snow grains'],
      80:['🌦️','Showers'],81:['🌧️','Showers'],82:['⛈️','Heavy showers'],85:['🌨️','Snow showers'],86:['❄️','Snow showers'],
      95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm'],99:['⛈️','Thunderstorm']};
    return map[code] || ['☁️',''];
  }

  // ---- time in the chosen zone ----
  var fmt = null;
  try { fmt = new Intl.DateTimeFormat('en-US',{timeZone:CONFIG.timeZone,hour12:false,year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}); } catch(e){}
  function now(){
    var d = new Date();
    if (!fmt) return {y:d.getFullYear(),mo:d.getMonth()+1,d:d.getDate(),h:d.getHours(),mi:d.getMinutes(),s:d.getSeconds()};
    var m = fmt.format(d).match(/(\d+)\/(\d+)\/(\d+),?\s+(\d+):(\d+):(\d+)/);
    return {y:+m[3],mo:+m[1],d:+m[2],h:(+m[4])%24,mi:+m[5],s:+m[6]};
  }
  var DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];

  // ---- flip cards ----
  var shown = ['', '', '', ''];
  function cardHTML(oldV, newV, animate){
    return '<div class="half top"><span>' + newV + '</span></div>' +
           '<div class="half bottom"><span>' + oldV + '</span></div>' +
           (animate ? '<div class="half top anim"><span>' + oldV + '</span></div>' +
                      '<div class="half bottom anim"><span>' + newV + '</span></div>' : '');
  }
  function setDigit(i, v){
    if (shown[i] === v) return;
    var el = $('d' + i), first = shown[i] === '';
    el.innerHTML = cardHTML(first ? v : shown[i], v, !first);
    shown[i] = v;
    if (!first) setTimeout(function(){ if (shown[i] === v) el.innerHTML = cardHTML(v, v, false); }, 700);
  }

  var lastBlock = -1;
  function tick(){
    var t = now();
    var h = CONFIG.use24h ? t.h : (t.h % 12 || 12);
    var hs = CONFIG.use24h ? pad(h) : (h < 10 ? ' ' + h : '' + h);
    setDigit(0, hs.charAt(0) === ' ' ? '&nbsp;' : hs.charAt(0));
    setDigit(1, hs.charAt(1));
    setDigit(2, pad(t.mi).charAt(0));
    setDigit(3, pad(t.mi).charAt(1));
    $('ampm').textContent = CONFIG.use24h ? '' : (t.h < 12 ? 'AM' : 'PM');
    var dow = new Date(Date.UTC(t.y, t.mo-1, t.d)).getUTCDay();
    $('date').textContent = DAYS[dow] + ' · ' + MONTHS[t.mo-1] + ' ' + t.d;

    var per = CONFIG.jokeEveryHours;
    var block = Math.floor(Date.UTC(t.y, t.mo-1, t.d) / 86400000) * Math.round(24/per) + Math.floor(t.h / per);
    if (block !== lastBlock){
      lastBlock = block;
      var j = JOKES[block % JOKES.length];
      $('jq').textContent = j[0]; $('ja').textContent = j[1];
    }

    var night = CONFIG.dimFrom > CONFIG.dimUntil ? (t.h >= CONFIG.dimFrom || t.h < CONFIG.dimUntil)
                                                 : (t.h >= CONFIG.dimFrom && t.h < CONFIG.dimUntil);
    $('dim').style.opacity = night ? CONFIG.dimAmount : 0;
    if (t.h === 3 && t.mi === 30 && t.s === 0) location.reload();
  }

  // ---- weather (Open-Meteo, free, no key) ----
  function renderWx(w){
    var c = w.current, d = w.daily, info = wmo(c.weather_code, c.is_day);
    $('ico').textContent = info[0];
    $('temp').textContent = Math.round(c.temperature_2m) + '°';
    $('desc').textContent = CONFIG.city + ' · ' + info[1];
    $('hi').textContent = Math.round(d.temperature_2m_max[0]) + '°';
    $('lo').textContent = Math.round(d.temperature_2m_min[0]) + '°';
    $('feels').textContent = Math.round(c.apparent_temperature) + '°';
  }
  function loadWx(){
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + CONFIG.lat + '&longitude=' + CONFIG.lon +
      '&current=temperature_2m,apparent_temperature,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min' +
      '&timezone=' + encodeURIComponent(CONFIG.timeZone) + '&forecast_days=1';
    var x = new XMLHttpRequest();
    x.open('GET', url, true); x.timeout = 20000;
    x.onload = function(){
      if (x.status !== 200) return retry();
      try { renderWx(JSON.parse(x.responseText)); try { localStorage.setItem('wx2', x.responseText); } catch(e){} }
      catch(e){ retry(); }
    };
    x.onerror = x.ontimeout = retry;
    x.send();
  }
  function retry(){ setTimeout(loadWx, 60000); }

  try { var c = localStorage.getItem('wx2'); if (c) renderWx(JSON.parse(c)); } catch(e){}
  tick(); setInterval(tick, 1000);
  loadWx(); setInterval(loadWx, 15 * 60 * 1000);
  document.body.addEventListener('click', loadWx);
})();
</script>
</body>
</html>
